sources:
  - id: reddit_forhire
    enabled: true
    collector: reddit_rss
    category: freelance
    url: https://www.reddit.com/r/forhire/new/.rss
    max_items: 50
    timeout_seconds: 30
    options:
      required_flair_prefix: "[Hiring]"

  - id: reddit_jobbit
    # Rejected (Phase 3A): live smoke showed [HIRING] is dominated by yearly
    # salaried job-board reposts that slip past text-evidence quarantine.
    # See docs/sources.md for the evidence.
    enabled: false
    collector: reddit_rss
    category: freelance
    url: https://www.reddit.com/r/jobbit/new/.rss
    max_items: 50
    timeout_seconds: 30
    options:
      allowed_title_prefixes:
        - "[Hiring]"

  - id: reddit_slavelabour
    # Verified (Phase 3A): requester-side [TASK] posts only; live smoke on
    # 2026-08-13 passed docs/source-admission.md (see docs/sources.md).
    enabled: true
    collector: reddit_rss
    category: freelance
    url: https://www.reddit.com/r/slavelabour/new/.rss
    max_items: 50
    timeout_seconds: 30
    options:
      allowed_title_prefixes:
        - "[TASK]"

  - id: hackernews_hiring
    # Disabled until the collector can retain contracts/projects while excluding ordinary jobs.
    enabled: false
    collector: hackernews_hiring
    category: direct_job
    url: https://hn.algolia.com/api/v1
    max_items: 100
    timeout_seconds: 30
    options:
      thread_query: "Ask HN: Who is hiring?"

  - id: hackernews_freelancer
    # Verified (Phase 3B): requester-side SEEKING FREELANCER comments only;
    # live smoke 2026-08-14 passed docs/source-admission.md (see docs/sources.md).
    enabled: true
    collector: hackernews_freelancer
    category: freelance
    url: https://hn.algolia.com/api/v1
    max_items: 50
    timeout_seconds: 30
    options:
      thread_query: "Freelancer? Seeking freelancer?"
      allowed_comment_prefixes:
        - "SEEKING FREELANCER"

  - id: algora_bounties
    enabled: true
    collector: github_bounty_search
    category: bounty
    url: https://api.github.com/search/issues
    max_items: 50
    timeout_seconds: 30
    options:
      query: 'is:issue is:open label:bounty algora in:title,body'
      platform_marker: algora
      max_signal_repetitions: 25

  - id: opire_bounties
    enabled: true
    collector: opire_next_data
    category: bounty
    url: https://app.opire.dev/home
    max_items: 50
    timeout_seconds: 45
    options:
      fetcher: dynamic

  - id: superteam_earn
    enabled: true
    collector: scrapling_links
    category: mixed
    url: https://superteam.fun/earn/all?tab=bounties
    max_items: 50
    timeout_seconds: 45
    options:
      fetcher: dynamic
      link_pattern: "/earn/listing/"
      title_selector: "p.line-clamp-1::text"
      detail_hint: "bounty grant project job"
